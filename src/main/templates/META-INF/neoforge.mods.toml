modLoader = "javafml"
loaderVersion = "[0,)"
license = "${mod_license}"
issueTrackerURL="https://github.com/Ace-Tonba/Deep-Diving-Gear/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile="logo.png"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "create"
versionRange = "[6.0.10,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "deeperdarker"
versionRange = "[1.4.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "creategoggles"
type = "optional"
versionRange = "[6.1.1,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config="deepdivinggear.mixins.json"
